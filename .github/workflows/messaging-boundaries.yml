name: Messaging boundaries

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: messaging-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: diachat_test
          POSTGRES_USER: diachat
          POSTGRES_PASSWORD: diachat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diachat -d diachat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_DIALECT: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: diachat_test
      DB_USER: diachat
      DB_PASS: diachat
      NPM_CONFIG_ENGINE_STRICT: "true"
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: bash -n ../../scripts/deploy-build.sh ../../scripts/deploy-run.sh ../../scripts/post-merge.sh
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run check:messaging-boundaries
      - run: npm run check:messaging-architecture
      - run: npm run check:boundary-fixtures
      - run: npm run build
      - run: npx sequelize db:migrate
      - run: npx sequelize db:migrate:undo:all
      - run: npx sequelize db:migrate
      - run: npx jest --runInBand --coverage=false

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev --audit-level=critical
      - run: bash replit-start.sh --patches-only
      - run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ""
          GENERATE_SOURCEMAP: "false"
          NODE_OPTIONS: "--openssl-legacy-provider --max-old-space-size=2560"
